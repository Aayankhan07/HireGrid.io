version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - ENV=production
      - ALLOW_DEV_BYPASS=false
      - JWT_SECRET=production-secret-key-hiregrid-change-this
      - DATABASE_URL=postgresql://hiregrid:hiregrid_pass@db:5432/hiregrid_db
      - ALLOWED_ORIGINS=http://localhost:7860,http://localhost:3000
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: hiregrid_postgres
    environment:
      - POSTGRES_USER=hiregrid
      - POSTGRES_PASSWORD=hiregrid_pass
      - POSTGRES_DB=hiregrid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
